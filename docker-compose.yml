services:
  mineops:
    build:
      context: .
      dockerfile: Dockerfile.runtime
    container_name: mineops_bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"